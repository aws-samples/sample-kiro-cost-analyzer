description = "AI Agent for Git-Kiro semantic correlation analysis"
requires-python = ">=3.12"
dependencies = [
    "strands-agents>=0.1.0",
    "boto3>=1.35.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
