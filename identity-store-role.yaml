AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Kiro Cost Analyzer — cross-account IAM Role for read-only IAM Identity
  Center access. Deploy this template in the IDC account (AWS Organizations
  management account or the delegated Identity Center account).

Parameters:
  KiroAccountId:
    Type: String
    Description: AWS account ID where Kiro Cost Analyzer is deployed
    AllowedPattern: "\\d{12}"
    ConstraintDescription: Must be a valid 12-digit AWS account ID

  IdentityStoreId:
    Type: String
    AllowedPattern: "d-[0-9a-z]{10}"
    ConstraintDescription: Must be a valid Identity Store ID (e.g. d-1234567890)
    Description: >
      IAM Identity Center Identity Store ID (e.g. d-1234567890). Used to
      scope the IAM policy's Resource element to this specific identity
      store rather than every identity store in the account.

Resources:
  IdentityStoreReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: kiro-identity-store-read
      Description: Read-only access to IAM Identity Center Identity Store
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: IdentityStoreReadOnly
            Effect: Allow
            Action:
              - identitystore:DescribeUser
              - identitystore:ListUsers
            # Scoped to the specific identity store rather than "*" (every
            # identity store in the account). Both resource types are
            # required together per the AWS Identity Store service
            # authorization reference: the identitystore/{id} resource
            # scopes which store, and the wildcard user/* resource is
            # required because these actions operate over its users.
            Resource:
              - !Sub "arn:aws:identitystore::${AWS::AccountId}:identitystore/${IdentityStoreId}"
              - "arn:aws:identitystore:::user/*"

  CrossAccountIdentityStoreRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: kiro-cost-analyzer-identity-store-read
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${KiroAccountId}:root"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:PrincipalAccount: !Ref KiroAccountId
      ManagedPolicyArns:
        - !Ref IdentityStoreReadPolicy

Outputs:
  IdentityStoreRoleArn:
    Description: >
      ARN of the cross-account Identity Store role. Use this value in the
      main stack's IdentityStoreRoleArn parameter or paste it into the
      Settings page.
    Value: !GetAtt CrossAccountIdentityStoreRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-IdentityStoreRoleArn"
